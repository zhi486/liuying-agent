version: "3.9"

services:
  # ===== AI 教练后端 =====
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: healthy-agent-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-5}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.anthropic.com}
      - FISH_AUDIO_API_KEY=${FISH_AUDIO_API_KEY}
      - FISH_AUDIO_REFERENCE_ID=${FISH_AUDIO_REFERENCE_ID}
    env_file:
      - .env  # 可选：本地开发用
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===== Redis 缓存（可选） =====
  redis:
    image: redis:7-alpine
    container_name: healthy-agent-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis-data:/data
    # 仅在需要 LLM 响应缓存时启用
    profiles:
      - cache

volumes:
  redis-data:
